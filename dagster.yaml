# Dagster instance configuration
# PostgreSQL backend for run storage, event log, and schedule state

storage:
  postgres:
    postgres_db:
      hostname: postgres
      port: 5432
      username: postgres
      password: postgres
      db_name: dagster

local_artifact_storage:
  module: dagster._core.storage.root
  class: LocalArtifactStorage
  config:
    base_dir: /app/dagster_home/local

compute_logs:
  module: dagster._core.storage.local_compute_log_manager
  class: LocalComputeLogManager
  config:
    base_dir: /app/dagster_home/logs

run_launcher:
  module: dagster._core.launcher.default_run_launcher
  class: DefaultRunLauncher

# Capture mkpipe Python logging in Dagster UI
python_logs:
  managed_python_loggers:
    - mkpipe
  python_log_level: INFO
