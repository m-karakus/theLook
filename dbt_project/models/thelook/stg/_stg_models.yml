version: 2

models:
  - name: stg_orders
    description: "Cleaned orders from BigQuery theLook dataset"
    columns:
      - name: order_id
        tests:
          - not_null
          - unique

  - name: stg_order_items
    description: "Cleaned order line items"
    columns:
      - name: order_item_id
        tests:
          - not_null
          - unique

  - name: stg_products
    description: "Product catalog with categories and pricing"
    columns:
      - name: product_id
        tests:
          - not_null
          - unique

  - name: stg_users
    description: "Registered users / customers"
    columns:
      - name: user_id
        tests:
          - not_null
          - unique

  - name: stg_events
    description: "User browsing events"
    columns:
      - name: event_id
        tests:
          - not_null

  - name: stg_inventory_items
    description: "Inventory items with cost and product info"
    columns:
      - name: inventory_item_id
        tests:
          - not_null

  - name: stg_distribution_centers
    description: "Distribution center locations"
    columns:
      - name: distribution_center_id
        tests:
          - not_null
          - unique
