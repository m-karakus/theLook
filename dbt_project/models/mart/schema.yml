version: 2

models:
  - name: mart_customer_revenue
    description: "Total revenue and order count per customer"
    columns:
      - name: user_id
        description: "Customer identifier"
        tests:
          - not_null
          - unique
      - name: total_orders
        tests:
          - not_null
      - name: total_revenue
        tests:
          - not_null

  - name: mart_aov_daily
    description: "Average order value per day"
    columns:
      - name: created_date
        description: "Order date"
        tests:
          - not_null
          - unique
      - name: avg_order_value
        tests:
          - not_null
      - name: total_orders
        tests:
          - not_null

  - name: mart_category_sales
    description: "Sales summary by product category"
    columns:
      - name: category
        description: "Product category"
        tests:
          - not_null
          - unique
      - name: total_revenue
        tests:
          - not_null
      - name: total_items_sold
        tests:
          - not_null
